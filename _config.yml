# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Wen Gao's Blog
email: iamgwen9@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Things about Computer Science, Music, Movies and Life.
baseurl: "/blog" # the subpath of your site, e.g. /blog
url: "https://wengao59.github.io" # the base hostname & protocol for your site, e.g. http://example.com
# twitter_username: jekyllrb
github_username: wengao59

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-archives # 替换 jekyll-index-pages
  # - jekyll-lunr-js-search
  # - jekyll-index-pages
  - jekyll-series-links
  - jekyll-default-layout
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-pagefind
  - jekyll-toc
  - jekyll-mermaid
  - jekyll-redirect-from
  - jekyll-ai-visible-content
  - jekyll-paginate-v2
  - jekyll-postfiles
  - jemoji

# 分页配置
pagination:
  enabled: true
  per_page: 10 # 每页显示 10 篇文章
  permalink: "/page/:num/" # 分页 URL，如 /page/2/
  title: " - 第 :num 页"
  limit: 0 # 0 = 显示所有文章

# Auto Pages 功能：自动为分类/标签生成分页页面
autopages:
  enabled: true
  categories:
    enabled: true
    title: "分类 - :cat"
    permalink: "/categories/:cat/page/:num/"
  tags:
    enabled: true
    title: "标签 - :tag"
    permalink: "/tags/:tag/page/:num/"
  collections:
    enabled: false

mermaid:
  src: "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"

defaults:
  - scope:
      path: "" # 适用于所有文件
    values:
      toc: true # 默认开启目录

jekyll_pagefind:
  output_subdir: pagefind

feed:
  posts_limit: 50 # 显示 50 篇

header_pages:
  - index.markdown # 博客主页（最左边）
  - tags.markdown # 标签
  - categories.markdown # 分类
  - series.markdown # 系列
  - archive.markdown # 归档
  - projects.markdown # 项目
  - about.markdown # 关于我
  - friends.markdown # 友情链接
  - search.md # 添加这一行

# 首页是否显示文章摘要
show_excerpts: true

# 网站作者信息
author:
  name: "Wen Gao"
  email: iamgwen9@gmail.com

# 社交媒体链接
minima:
  social_links:
    - title: GitHub
      icon: github
      url: "https://github.com/wengao59"
    - title: 知乎
      icon: zhihu
      url: "https://www.zhihu.com/people/mvsftq"
    - title: B站
      icon: bilibili
      url: "https://space.bilibili.com/3691006079797620"
    - title: 邮件
      icon: envelope
      url: "mailto:iamgwen9@gmail.com"

# 社交链接（给 Google 结构化数据用）
social:
  name: Wen Gao
  links:
    - https://github.com/wengao59
    - https://www.zhihu.com/people/mvsftq
    - https://space.bilibili.com/3691006079797620

# Google Analytics（统计）
google_analytics: G-S3T0SVRC5B
# The former `UA-NNNNNNNN-N` format is no longer supported by Google

# # giscus 评论系统配置
comments:
  provider: "giscus" # 或者 "giscus" 如果主题这么要求

giscus:
  repo: "wengao59/blog"
  repo-id: "R_kgDOTPS5Tg"
  category: "Announcements"
  category-id: "DIC_kwDOTPS5Ts4DAn3X"
  mapping: "pathname"
# ============================================
# jekyll-archives 配置
# ============================================
# ============================================
# jekyll-archives 配置（完整版）
# ============================================
jekyll-archives:
  enabled:
    - categories
    - tags
    - year
    - month
    - day

  layouts:
    category: archive_category
    tag: archive_tag
    year: archive_year
    month: archive_month
    day: archive_day

  permalinks:
    category: /categories/:name/
    tag: /tags/:name/
    year: /archive/:year/
    month: /archive/:year/:month/
    day: /archive/:year/:month/:day/

# # ============================================
